# ============================================================
# Perfil de produção — ative com SPRING_PROFILES_ACTIVE=prod
# (ou --spring.profiles.active=prod).
# Sobrescreve apenas o que muda em relação ao ambiente de dev.
# ============================================================

# Carrega o .env de PRODUÇÃO (arquivo separado, gitignored).
# Se ele não existir ou estiver incompleto, as checagens de segurança
# (PDV.PDV.config.ProducaoSafetyChecks) impedem a aplicação de subir.
spring.config.import=optional:file:.env.production[.properties]

# Em produção o schema é apenas VALIDADO (não é alterado automaticamente).
# Antes do primeiro deploy, rode uma vez com ddl-auto=update (ou gere o schema
# por migração) para criar as tabelas; depois mantenha sempre "validate".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Níveis de log mais silenciosos em produção (o destino vem do logback-spring.xml).
logging.level.org.hibernate=WARN
logging.level.org.springframework=INFO
logging.level.PDV.PDV=INFO

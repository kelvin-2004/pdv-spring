<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmitas Sousa | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primaria: #63452C; --secundaria: #F6D32D; --fundo: #F6F5F4; }
        body { min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: #333; }
        .login-card { width: min(420px, calc(100% - 2rem)); border: 0; border-radius: 16px; box-shadow: 0 12px 32px rgba(99, 69, 44, .12); }
        .login-header { background: var(--primaria); color: white; border-radius: 16px 16px 0 0; }
        .btn-login { background: var(--secundaria); color: var(--primaria); font-weight: 700; border: 0; }
        .btn-login:hover { background: #e0be23; color: var(--primaria); }
        .btn-mostrar-senha { border-color: #dee2e6; color: #6c757d; }
        .btn-mostrar-senha:hover { background: #f8f9fa; color: var(--primaria); }
    </style>
</head>
<body>
<main class="card login-card">
    <div class="login-header p-4 text-center">
        <h1 class="h4 mb-1">Marmitas Sousa</h1>
        <p class="mb-0 opacity-75">Acesso ao sistema PDV</p>
    </div>
    <div class="card-body p-4">
        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">Usuário ou senha inválidos.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">Sessão encerrada.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuário</label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                    <button type="button" id="alternarSenha" class="btn btn-mostrar-senha" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">Entrar</button>
        </form>
    </div>
</main>
<script>
    document.getElementById('alternarSenha').addEventListener('click', function () {
        const campoSenha = document.getElementById('password');
        const mostrandoSenha = campoSenha.type === 'text';
        campoSenha.type = mostrandoSenha ? 'password' : 'text';
        this.title = mostrandoSenha ? 'Mostrar senha' : 'Ocultar senha';
        this.setAttribute('aria-label', this.title);
        this.setAttribute('aria-pressed', String(!mostrandoSenha));
        this.querySelector('i').className = mostrandoSenha ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    });
</script>
</body>
</html>

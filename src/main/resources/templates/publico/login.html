<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmitas Sousa | Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
    <style>:root{--p:#63452C;--s:#F6D32D;--f:#F6F5F4}body{min-height:100vh;display:grid;place-items:center;background:var(--f)}.box{width:min(430px,calc(100% - 2rem));border:0;border-radius:16px;box-shadow:0 12px 32px #63452c20}.head{background:var(--p);color:#fff;border-radius:16px 16px 0 0}.btn-m{background:var(--s);color:var(--p);font-weight:700;border:0}.btn-google{background:#fff;color:#444;border:1px solid #ddd;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:.55rem;border-radius:8px;text-decoration:none}.btn-google:hover{background:#f7f7f7;color:#333}</style>
</head>
<body><main class="card box"><div class="head p-4 text-center"><h1 class="h4 mb-1">Marmitas Sousa</h1><p class="mb-0">Entre para fazer seu pedido</p></div><div class="card-body p-4">
    <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div><div th:if="${sucesso}" class="alert alert-success py-2" th:text="${sucesso}"></div>
    <form th:action="@{/site/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="form-label fw-semibold" for="celular">Celular</label><input class="form-control mb-3" id="celular" name="celular" required placeholder="(11) 90000-0000">
        <label class="form-label fw-semibold" for="senha">Senha</label><input class="form-control mb-4" id="senha" name="senha" type="password" required>
        <button class="btn btn-m w-100" type="submit">Entrar</button>
    </form>
    <div class="text-center my-3"><span class="text-muted small">ou</span></div>
    <a class="btn btn-google w-100" th:href="@{/site/google}">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Entrar com Google
    </a>
    <p class="text-center text-muted small mt-3 mb-0">Ainda não tem conta? <a th:href="@{/site/cadastro}">Cadastre-se</a></p><p class="text-center small mt-2"><a th:href="@{/site}">Voltar ao cardápio</a></p>
</div></main><th:block th:replace="~{publico/fragments/ajuda-whatsapp :: botao}"></th:block><script th:src="@{/js/publico.js}"></script></body></html>

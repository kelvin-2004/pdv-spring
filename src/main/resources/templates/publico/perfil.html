<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmitas Sousa | Meus dados</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%2363452C' d='M256 32c125.7 0 228 102.3 228 228s-102.3 228-228 228S28 385.7 28 260 130.3 32 256 32zm0 64c-92.8 0-164 71.2-164 164s71.2 164 164 164 164-71.2 164-164-71.2-164-164-164z'/%3E%3Cpath fill='%23F6D32D' d='M176 220h160v64H176z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
    <style>
        :root { --primaria:#63452C; --secundaria:#F6D32D; --fundo:#F6F5F4; }
        body { background:var(--fundo); color:#332a26; }
        .navbar-custom { background:var(--primaria); }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color:#fff; }
        .navbar-custom .nav-link:hover { color:var(--secundaria); }
        .logo { width:42px; height:42px; border-radius:50%; border:2px solid var(--secundaria); object-fit:cover; }
        .footer-custom { background:var(--primaria); color:#f0e6d8; }
        .btn-marmita { background:var(--secundaria); color:var(--primaria); font-weight:700; border:0; }
        .btn-marmita:hover { background:#e0be23; color:var(--primaria); }
        .card-soft { border:0; border-radius:14px; box-shadow:0 8px 22px rgba(99,69,44,.08); }
    </style>
</head>
<body>
<th:block th:replace="~{publico/fragments/navbar-publico :: nav(active='perfil')}"></th:block>

<main class="container py-5">
    <h1 class="h3 fw-bold mb-4">Meus dados</h1>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card card-soft">
        <div class="card-body p-4">
            <form th:action="@{/site/perfil}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <h2 class="h5 fw-bold mb-3">Dados pessoais</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nome</label>
                        <input class="form-control" name="nome" th:value="${cliente.nome}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Celular</label>
                        <input class="form-control" name="celular" th:value="${cliente.celular}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input class="form-control" name="email" type="email" th:value="${cliente.email}">
                    </div>
                </div>

                <h2 class="h5 fw-bold mt-4 mb-3">Endereço de entrega</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">CEP</label>
                        <input class="form-control" name="cep" th:value="${cliente.cep}">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Rua</label>
                        <input class="form-control" name="rua" th:value="${cliente.rua}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Número</label>
                        <input class="form-control" name="numero" th:value="${cliente.numero}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Bairro</label>
                        <input class="form-control" name="bairro" th:value="${cliente.bairro}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Complemento</label>
                        <input class="form-control" name="complemento" th:value="${cliente.complemento}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Ponto de referência</label>
                        <input class="form-control" name="pontoReferencia" th:value="${cliente.pontoReferencia}">
                    </div>
                </div>

                <h2 class="h5 fw-bold mt-4 mb-3">Alterar senha (opcional)</h2>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nova senha</label>
                        <input class="form-control" name="novaSenha" type="password" minlength="8" placeholder="Deixe em branco para manter">
                    </div>
                </div>

                <button class="btn btn-marmita w-100 mt-4" type="submit">Salvar alterações</button>
            </form>
        </div>
    </div>
</main>

<footer class="footer-custom mt-5">
    <div class="container py-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
        <span class="small opacity-75">Criado por <a class="text-reset text-decoration-none" href="https://github.com/kelvin-2004" target="_blank" rel="noopener"><i class="fa-brands fa-github me-1"></i>Kelvin</a></span>
        <div class="d-flex gap-2">
            <a class="btn btn-marmita" href="https://wa.me/5511961659359?text=Ol%C3%A1!%20Preciso%20de%20suporte." target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp me-1"></i> Suporte</a>
            <a class="btn btn-outline-light" href="https://wa.me/5511961659359?text=Ol%C3%A1!%20Tenho%20uma%20d%C3%BAvida." target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp me-1"></i> Dúvidas</a>
            <a class="btn btn-outline-light" href="https://www.instagram.com/marmitas_sousa_morato/" target="_blank" rel="noopener"><i class="fa-brands fa-instagram me-1"></i> Instagram</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const carrinho = JSON.parse(localStorage.getItem('carrinhoPublico') || '[]');
    document.getElementById('navCartCount').textContent = carrinho.reduce((t, i) => t + i.quantidade, 0);
</script>
<script th:src="@{/js/publico.js}"></script>
</body>
</html>

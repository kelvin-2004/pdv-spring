# Carrega as credenciais e demais variáveis do arquivo .env local.
spring.config.import=optional:file:.env[.properties]

# Configuração direta do MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Sessão do PDV: mantém o operador logado por até 12h (evita login frequente).
# O painel de pedidos ainda faz polling periódico, o que renova a sessão enquanto a página está aberta.
server.servlet.session.timeout=12h

# Atrás do proxy reverso (Traefik/Coolify) o Spring precisa confiar nos cabeçalhos
# X-Forwarded-Proto para gerar URLs https (redirects do login Google, webhooks etc.).
server.forward-headers-strategy=framework

# Limites de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.sql.init.mode=never

# Ativa o seeder de dados fake (produtos, clientes e pedidos) ao subir a aplicação.
# Use apenas em ambiente de teste: ./mvnw spring-boot:run -Dspring-boot.run.arguments="--app.seed.demo=true"
# app.seed.demo=true

# Acesso ao PDV. Em produção, defina PDV_LOGIN_USERNAME e PDV_LOGIN_PASSWORD no ambiente.
pdv.security.username=${PDV_LOGIN_USERNAME:admin}
pdv.security.password=${PDV_LOGIN_PASSWORD:admin123}

# Nome exato da impressora térmica instalada no sistema (usada para imprimir comandas).
# Ajuste conforme o nome que aparece no Painel de Controle / Impressoras.
impressora.nome=${IMPRESSORA_TERMICA:termica}
impressora.modo=${IMPRESSAO_MODO:local}

# Mercado Pago (sandbox). Defina MERCADO_PAGO_PUBLIC_KEY e MERCADO_PAGO_ACCESS_TOKEN no .env.
mercado.pago.public-key=${MERCADO_PAGO_PUBLIC_KEY:}
mercado.pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
# URL pública (HTTPS) para receber notificações de pagamento do Mercado Pago (webhook).
mercado.pago.webhook-url=${MERCADO_PAGO_WEBHOOK_URL:}
# Secret opcional para validar a assinatura das notificações (header x-signature). Vazio = não valida.
mercado.pago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}

# Endereço da loja, exibido na opção de retirada no balcão (carrinho e "Meus pedidos").
loja.endereco-linha1=R. Quinze, 292 - Jardim Vassouras
loja.endereco-linha2=Francisco Morato - SP, 07953-170
# Link oficial do Google Maps (Como chegar) — https://maps.app.goo.gl/JrmmR3oY83w2QjKU7
loja.maps-url=https://maps.app.goo.gl/JrmmR3oY83w2QjKU7

# Fuso horário padrão para serialização de datas/horas em JSON (Brasil).
spring.jackson.time-zone=America/Sao_Paulo
# Carrega as credenciais e demais variáveis do arquivo .env local.
spring.config.import=optional:file:.env[.properties]

# Configuração direta do MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Limites de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.sql.init.mode=never

# Acesso ao PDV. Em produção, defina PDV_LOGIN_USERNAME e PDV_LOGIN_PASSWORD no ambiente.
pdv.security.username=${PDV_LOGIN_USERNAME:admin}
pdv.security.password=${PDV_LOGIN_PASSWORD:admin123}
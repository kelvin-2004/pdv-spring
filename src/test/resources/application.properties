# Banco de teste em memória (H2) — substitui o MySQL local nos testes,
# evitando depender de um servidor MySQL rodando na máquina.
spring.datasource.url=jdbc:h2:mem:pdvtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

# Credenciais do PDV (padrões, sem depender do .env)
pdv.security.username=admin
pdv.security.password=admin123

# iFood: sem credenciais o polling não dispara (a verificação acontece antes de qualquer chamada).
ifood.modo=polling
